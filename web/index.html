<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Geringonça: jogo de física / physics puzzle game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Geringonça">
  <link rel="apple-touch-icon" href="icons/geringonca-v2-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-v2.png"/>

  <title>Geringonça</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pedido adiantado: o Box2D só seria pedido depois que o jogo iniciasse; assim
       baixa junto com o código (medido: 4G 2,30 → 2,16 s até o jogo ficar pronto).
       As fontes ficam de fora de propósito: adiantadas, disputam a banda com o
       motor do jogo e o carregamento piora (7,2 s contra 6,5 s a 10 Mbit/s). -->
  <link rel="preload" href="assets/packages/forge2d/lib/src/backend/wasm/box2d.wasm" as="fetch" crossorigin>
  <meta name="theme-color" content="#000000">

  <!-- Abertura: a marca do estúdio, em preto e branco. Um raio cai, tudo pisca
       rapidinho (dois clarões, bem abaixo do limite de 3 por segundo) e o nome
       treme como num tremor secundário. Fica até o primeiro quadro do jogo. -->
  <style>
    html, body { margin: 0; background: #000; }
    #carregando {
      position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 16px; box-sizing: border-box; background: #000; color: #fff;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease;
      animation: pisca 2.2s linear both; -webkit-tap-highlight-color: transparent;
    }
    /* os clarões: a tela inteira se inverte por um instante, duas vezes */
    @keyframes pisca {
      0%, 18.9% { filter: none; }
      19%, 21.5% { filter: invert(1); }
      21.6%, 24% { filter: none; }
      24.1%, 26% { filter: invert(1); }
      26.1%, 100% { filter: none; }
    }
    #carregando .raio { width: min(16vw, 72px); height: auto; animation: cai .14s .3s cubic-bezier(.2, .8, .2, 1) both, brilho 2.4s 1.2s ease-in-out infinite; }
    @keyframes cai { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes brilho { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
    #carregando .nome { display: flex; flex-direction: column; align-items: center; opacity: 0; animation: aparece .01s .42s both, treme .4s .42s both; }
    #carregando .nome b {
      font: 900 clamp(30px, 9vw, 68px)/1 "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
      letter-spacing: .06em; text-shadow: 0 0 18px rgba(255, 255, 255, .35);
    }
    #carregando .nome span { margin-top: 10px; font: 600 clamp(12px, 3vw, 18px)/1 system-ui, sans-serif; letter-spacing: .62em; padding-left: .62em; color: #bbb; }
    @keyframes aparece { to { opacity: 1; } }
    @keyframes treme {
      0% { transform: translate(0, 0); } 15% { transform: translate(-7px, 2px); } 30% { transform: translate(6px, -2px); }
      45% { transform: translate(-4px, 1px); } 60% { transform: translate(3px, 0); } 80% { transform: translate(-1px, 0); } 100% { transform: none; }
    }
    #carregando .barra { width: min(40vw, 180px); height: 2px; background: #333; overflow: hidden; visibility: hidden; }
    #carregando .barra i { display: block; width: 40%; height: 100%; background: #fff; animation: vai 1.1s ease-in-out infinite; }
    @keyframes vai { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #carregando.esperando .barra { visibility: visible; }
    #carregando-texto { min-height: 1.4em; color: #888; font-size: 13px; letter-spacing: .04em; }
    #carregando.saindo { opacity: 0; pointer-events: none; }
    #carregando.pronto { cursor: pointer; }
    /* quem pediu menos movimento vê a marca parada, sem clarões */
    @media (prefers-reduced-motion: reduce) {
      #carregando, #carregando .raio, #carregando .nome, #carregando .barra i { animation: none; }
      #carregando .nome { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="carregando" role="status" aria-live="polite">
    <svg class="raio" viewBox="0 0 64 120" width="72" height="135" aria-hidden="true">
      <polygon points="40,2 8,66 30,66 18,118 58,48 35,48 50,2" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <div class="nome" aria-label="Aftershock Studios"><b>AFTERSHOCK</b><span>STUDIOS</span></div>
    <div class="barra" aria-hidden="true"><i></i></div>
    <span id="carregando-texto"></span>
  </div>
  <script>
    // idioma da abertura: a opção salva no jogo (og-lang) ou o do aparelho
    var ingles = (function () {
      try {
        var v = localStorage.getItem('flutter.og-lang');
        while (typeof v === 'string' && v.charAt(0) === '"') v = JSON.parse(v);
        if (v === 'pt' || v === 'en') return v === 'en';
      } catch (e) {}
      return !/^pt\b/i.test(navigator.language || '');
    })();
    if (ingles) document.documentElement.lang = 'en';

    var abertura = 2200; // duração da animação do raio
    var el = document.getElementById('carregando');
    var texto = document.getElementById('carregando-texto');
    var calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // terminou a animação e o jogo ainda está carregando: mostra que está trabalhando
    var espera = setTimeout(function () {
      if (!el.isConnected) return;
      el.classList.add('esperando');
      texto.textContent = ingles ? 'Loading…' : 'Carregando…';
    }, calmo ? 600 : abertura);

    // some quando o jogo desenha o primeiro quadro, mas deixa a animação terminar
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(espera);
      var falta = calmo ? 0 : Math.max(0, abertura + 200 - performance.now());
      var feito = false;
      function sai() {
        if (feito) return;
        feito = true;
        document.removeEventListener('keydown', tecla);
        el.classList.add('saindo');
        setTimeout(function () { el.remove(); }, 400);
      }
      function tecla(e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') sai();
      }
      if (falta > 0) {
        // o jogo já carregou: um toque (ou Enter/Espaço/Esc) pula a abertura
        el.classList.remove('esperando');
        el.classList.add('pronto');
        texto.textContent = ingles ? 'Tap to skip' : 'Toque para pular';
        el.addEventListener('click', sai);
        document.addEventListener('keydown', tecla);
      }
      setTimeout(sai, falta);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

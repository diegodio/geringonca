name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # versão fixa: uma versão nova do Flutter pode mudar o que a análise acusa
      # (e travar a publicação) sem nenhuma mudança no jogo
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      # nada é publicado se a análise ou algum teste falhar
      - run: flutter analyze
      - run: flutter test
      # WebAssembly (com a versão JS para navegadores sem suporte) e o motor
      # gráfico servido junto do jogo (sem CDN), para o modo offline guardar tudo
      # a versão do jogo vem do histórico em lib/core/changelog.dart; o endereço e a chave
      # pública do Supabase: as do projeto geringonca (públicas por natureza; quem
      # protege os dados são as regras do banco). Variáveis do repositório com os
      # mesmos nomes, se existirem, têm preferência (veja docs/SUPABASE.md).
      - run: >-
          flutter build web --wasm --release --no-web-resources-cdn --base-href "/geringonca/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://kphgpybhubdluhjdresk.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CgivNdU8UaBr0PifwIkYlw_I4-RLO8-' }}
      # service worker com a lista de arquivos e a versão desta publicação
      - run: python3 tool/gen_sw.py build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
